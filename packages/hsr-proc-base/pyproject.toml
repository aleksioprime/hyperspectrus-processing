[project]
name = "hsr-proc-base"
version = "0.1.0"
description = "Контракт обработки мультиспектральных серий и реестр реализаций"
requires-python = ">=3.11"
# Пакет намеренно обходится numpy и pillow: он описывает контракт обработки,
# а тяжёлые зависимости (opencv, scikit-image, torch) объявляет у себя тот
# пакет, который приносит конкретный алгоритм.
dependencies = [
    "numpy>=2.1",
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsr_proc"]
