# Настройки приёмки этого алгоритма.
#
# Файл лежит внутри пакета намеренно: он попадает в колесо и читается и здесь,
# и у издателя. В pyproject.toml их держать нельзя - он в колесо не входит, и
# приёмка у издателя взяла бы настройки его собственного репозитория.
#
# profile = "reference" - алгоритм воспроизводит эталонную линейную модель.
# Для алгоритма на другой модели: profile = "custom", ослабленные допуски и
# обязательное объяснение каждого послабления в deviations.

profile = "reference"
deviations = []
