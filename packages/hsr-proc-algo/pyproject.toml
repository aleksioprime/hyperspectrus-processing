[project]
name = "hsr-proc-algo"
# Версия продолжает ту, что работает в приложении: по ней различают выпуски
# расчёта, и назад она не идёт.
version = "1.0.0"
description = "Алгоритм восстановления концентраций хромофоров для HyperSpectRus"
requires-python = ">=3.11"
dependencies = [
    "hsr-proc-base>=0.1,<0.2",
    "numpy>=2.1",
]

[project.entry-points."hsr_proc.processors"]
algo = "hsr_proc_algo:AlgoProcessor"

[dependency-groups]
dev = [
    "hsr-proc-conformance",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsr_proc_algo"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
