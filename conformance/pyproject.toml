[project]
name = "hsr-proc-conformance"
version = "0.1.0"
description = "Приёмочные проверки пакетов с алгоритмами обработки HyperSpectRus"
requires-python = ">=3.11"
dependencies = [
    "hsr-proc-base",
    "numpy>=2.1",
    "pillow>=11.0",
    "pytest>=8.3",
]

[project.scripts]
# Проверка пакета целиком: одна команда, один вердикт, один отчёт.
hsr-proc-check = "hsr_proc_conformance.cli:main"
# Прогон алгоритма на кадрах без рабочего места: карты и показатели в каталог.
hsr-proc-run = "hsr_proc_conformance.runner:main"

# Метки уровней проверок регистрируются плагином, поэтому в чужом репозитории
# ничего настраивать не нужно: `pytest -m contract` работает сразу.
[project.entry-points.pytest11]
hsr_proc_conformance = "hsr_proc_conformance.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsr_proc_conformance"]
