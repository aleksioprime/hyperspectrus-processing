# Заготовка пакета с алгоритмом обработки.
#
# Переименуйте: hsr-proc-myalgo → hsr-proc-<ваше>, каталог src/hsr_proc_myalgo
# и поле name класса. Имя реализации попадает в карточку сеанса, и по нему
# отличают, каким алгоритмом посчитан результат, - оно должно быть таким же
# уникальным, как название пакета.

[project]
name = "hsr-proc-myalgo"
version = "0.1.0"
description = "Алгоритм восстановления концентраций хромофоров"
requires-python = ">=3.11"
dependencies = [
    # Диапазон обязателен: контракт развивается, и пакет, собранный с
    # несовместимой версией, рабочее место просто не увидит.
    "hsr-proc-base>=0.1,<0.2",
    "numpy>=2.1",
    # Тяжёлые зависимости алгоритма объявляются здесь, а не в контракте:
    # "opencv-python-headless>=4.10",
    # "scikit-image>=0.24",
]

# Точка входа: по ней рабочее место находит реализацию. Слева произвольная
# метка, она ни на что не влияет; справа - модуль и класс, дающие объект
# реализации. Без этого раздела алгоритма для рабочего места не существует.
[project.entry-points."hsr_proc.processors"]
myalgo = "hsr_proc_myalgo:MyProcessor"

[dependency-groups]
dev = [
    "hsr-proc-conformance",
    "pytest>=8.3",
]

# При переносе заготовки в свой репозиторий раскомментируйте: контракт и набор
# проверок ставятся из общего репозитория по тегу версии контракта.
# [tool.uv.sources]
# hsr-proc-base = { git = "https://github.com/aleksioprime/hyperspectrus-processing", subdirectory = "packages/hsr-proc-base", tag = "v0.1.0" }
# hsr-proc-conformance = { git = "https://github.com/aleksioprime/hyperspectrus-processing", subdirectory = "packages/hsr-proc-conformance", tag = "v0.1.0" }

# Допуски приёмки. Пока алгоритм повторяет эталонную линейную модель, менять
# здесь нечего. Если он построен на другой модели - смотрите README: послабление
# объявляется вместе с причиной, тихо ослабить допуск проверки не дадут.
[tool.hsr_proc_conformance]
profile = "reference"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsr_proc_myalgo"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
