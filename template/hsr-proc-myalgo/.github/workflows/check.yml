# Приёмочные проверки алгоритма при каждой отправке.
#
# Пакет проверяется в чистом окружении: «у меня работает» и «работает у
# принимающего» расходятся именно здесь.

name: Проверка пакета

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Поставить зависимости
        run: uv sync

      - name: Приёмочные проверки
        run: uv run hsr-proc-check --report приёмка.md

      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: приёмка
          path: приёмка.md
