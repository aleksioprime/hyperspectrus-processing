# Проверка самого репозитория.
#
# Здесь проверяется не чужой алгоритм, а то, чем его будут проверять: набор
# приёмки прогоняется на заведомо правильной реализации и на подопытных с
# внесёнными нарушениями, а редактируемый пакет - на уровне `contract`.

name: Проверка

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 - версия на рабочем месте врача и на приборе, она обязательна.
        # Остальные - чтобы набор не разошёлся с окружением исследователя.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Поставить зависимости
        run: uv sync --all-packages

      - name: Линтер
        run: uv run ruff check .

      - name: Форматирование
        run: uv run ruff format --check .

      # Только на 3.11: проверка типов ведётся для целевой версии рабочего
      # места, и на более новых интерпретаторах mypy разбирает их стабы
      # правилами 3.11. Проверять один и тот же код трижды всё равно незачем.
      - name: Проверка типов
        if: matrix.python == '3.11'
        run: uv run mypy packages/hsr-proc-base/src packages/hsr-proc-algo/src conformance/src tools

      - name: Тесты набора приёмки
        run: uv run pytest

      - name: Пакет алгоритма проходит обязательный уровень
        run: uv run hsr-proc-check hsr-proc-algo --level contract
